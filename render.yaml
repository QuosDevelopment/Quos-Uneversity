services:
  - type: web
    name: quos-university
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python service.py
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: LOOP_INTERVAL_SECONDS
        value: "120"
      - key: RESPONSE_DELAY_SECONDS
        value: "3"
      - key: TRAINING_DATA_PATH
        value: training_data.jsonl
      - key: STATUS_PATH
        value: status.json
