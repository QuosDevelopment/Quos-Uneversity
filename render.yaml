services:
  - type: web
    name: quos-university
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python service.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: LOOP_INTERVAL_SECONDS
        value: "120"
      - key: RESPONSE_DELAY_SECONDS
        value: "3"
      - key: TRAINING_DATA_PATH
        value: training_data.jsonl
      - key: STATUS_PATH
        value: status.json
